[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    skills_eval: Run skill evaluation scenarios
    agent_eval: Run agent evaluation scenarios
env =
    PYTHONNOUSERSITE=1
    GUARDIAN_RATE_LIMIT_ENABLED=false
filterwarnings =
    ignore::DeprecationWarning:sounddevice
    ignore:Setting the shape on a NumPy array:DeprecationWarning
