
services:
  guardian-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardian-hub
    restart: unless-stopped
    ports:
      # Binds only to local loopback (or configured WireGuard host IP) on host
      - "127.0.0.1:8000:8000"
    environment:
      - GUARDIAN_GATEWAY_HOST=127.0.0.1
      - GUARDIAN_GATEWAY_PORT=8000
      - GUARDIAN_DATA_DIR=/app/.guardian
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PYTHONUNBUFFERED=1
    volumes:
      # Portable persistent data volumes outside the container image
      - guardian_data:/app/data
      - guardian_memory:/app/memory
      - guardian_audit:/app/.guardian
      - guardian_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  # Named volumes ensure data survives container recreation and hardware migration
  guardian_data:
    name: guardian_hub_data
  guardian_memory:
    name: guardian_hub_memory
  guardian_audit:
    name: guardian_hub_audit
  guardian_logs:
    name: guardian_hub_logs
